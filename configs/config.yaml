# Configuración compartida. Las áreas se confirman con el bufete (Cami, CP0).
seed: 42

areas:
  - laboral
  - civil
  - mercantil
  - penal
  - familia
  - otros

canales: [correo, formulario, documento, fisico]

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external
  results: experiments/results
  artifacts: artifacts

split:
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  temporal: false   # true si hay fechas confiables: test = lo más reciente

serving:
  model: m3             # m3 o m4: pesos guardados con --save en artifacts/
  max_text_chars: 20000 # la API rechaza textos más largos

confidence_threshold: 0.70   # τ de partida; el óptimo se elige con la curva de valor

# Hiperparámetros iniciales (se ajustan solo con val)
models:
  m1:
    max_len: 256
    embed_dim: 128
    filters: 100
    kernel_sizes: [3, 4, 5]
    dropout: 0.5
    lr: 1.0e-3
    weight_decay: 1.0e-2
    batch_size: 32
    epochs: 30
    patience: 5          # early stopping por F1 macro en val
    min_freq: 2          # frecuencia mínima para entrar al vocabulario
    max_vocab: 20000
  m2:
    checkpoint: dccuchile/bert-base-spanish-wwm-cased   # verificado 9 nov: existe, sin acceso restringido, CC BY 4.0 (con aviso para uso comercial)
    max_len: 256
    pooling: mean        # mean (media de tokens sin relleno) o cls
    embed_batch_size: 32
    lr: 1.0e-3
    batch_size: 32
    epochs: 20
  m3:
    checkpoint: dccuchile/bert-base-spanish-wwm-cased
    max_len: 256
    pooling: mean        # igual que M2, para que la única diferencia sea descongelar el encoder
    dropout: 0.1
    lr: 2.0e-5
    layer_decay: 0.9     # tasa menor en capas inferiores: lr * layer_decay^(capas por debajo de la cabeza)
    warmup_ratio: 0.1
    weight_decay: 0.01
    max_grad_norm: 1.0
    batch_size: 16
    epochs: 5
    patience: 2          # early stopping por F1 macro en val
    amp: true            # precisión mixta fp16, solo en GPU CUDA (Colab); poner false si diera NaN o errores
  m4:                      # M3 + adaptación de dominio; el fine-tuning final usa los hiperparámetros de m3
    dapt_lr: 5.0e-5
    dapt_epochs: 3
    dapt_batch_size: 16
    dapt_max_len: 256
    mlm_probability: 0.15
    include_train_texts: true   # usar también los textos de train (sin etiquetas) para la adaptación
    external_glob: "**/*.txt"   # corpus legal público en data/external/ (un caso o texto por párrafo)
